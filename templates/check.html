<h2>Check AI-Generated Content</h2>
<form method="POST">
    <textarea name="content" rows="5" cols="60" placeholder="Paste AI-generated text here..."></textarea><br>
    <button type="submit">Analyze</button>
</form>

{% if analysis %}
    <h3>Result:</h3>
    <p>{{ analysis }}</p>
{% endif %}
<a href="/">⬅ Back</a>

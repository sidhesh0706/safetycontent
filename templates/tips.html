<h2>AI Safety Tips</h2>
<ul>
    <li>Always verify AI-generated information from reliable sources.</li>
    <li>Encourage children to ask critical questions about what they read online.</li>
    <li>Be cautious of deepfakes and AI-edited images/videos.</li>
    <li>Promote transparency and ethical AI usage in classrooms.</li>
</ul>

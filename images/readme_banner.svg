<svg width="1280" height="420" viewBox="0 0 1280 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">AI Safety Content Guide banner</title>
  <desc id="desc">A dashboard-style banner for an AI safety education app with modules for deepfake forensics, prompt injection, scam response, and digital literacy.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="420" gradientUnits="userSpaceOnUse">

      <stop offset="0.48" stop-color="#102236"/>
      <stop offset="1" stop-color="#251A42"/>
    </linearGradient>
    <linearGradient id="gold" x1="224" y1="58" x2="663" y2="233" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFE9A3"/>
      <stop offset="1" stop-color="#F8B500"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

